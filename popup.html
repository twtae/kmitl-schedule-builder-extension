<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <img src="icons/icon32.png" alt="logo">
            <h1>KMITL Schedule</h1>
        </div>
        
        <div class="stats-card">
            <div id="credit-summary">No subjects selected</div>
        </div>

        <div class="menu">
            <div class="menu-item-toggle">
                <span>Dark Mode</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="menu-desc" style="padding: 10px 10px 0 10px; text-align: center; color: var(--subtext); font-size: 12px; border-top: 1px solid var(--border); margin-top: 4px;">
                Use the "Share" menu in the schedule builder to export your timetable.
            </div>
        </div>

        <div class="footer">
            <p>Navigate to KMITL Teaching Table to build your schedule.</p>
        </div>
    </div>
    <script src="src/utils.js"></script>
    <script src="popup.js"></script>
</body>
</html>
